name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Stamp application version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $releaseTag = $env:RELEASE_VERSION
          if (-not $releaseTag) { $releaseTag = $env:GITHUB_REF_NAME }
          $releaseTag = python scripts/stamp_version.py "$releaseTag"
          if ($LASTEXITCODE -ne 0) { throw "Could not parse release version." }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build standalone app
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name SKM-Importer --collect-all openpyxl --collect-all xlrd main.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" .\dist\SKM-Importer.exe --title "SKM Importer $env:RELEASE_TAG" --generate-notes